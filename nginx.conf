server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /nginx-health {
        access_log off;
        return 200 'ok';
    }

    # La página se sirve sin caché para que los cambios se vean al momento.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=86400";
    }
}
