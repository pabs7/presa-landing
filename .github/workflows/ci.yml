# Construye la imagen de la landing, la arranca y comprueba que se sirve bien.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t presa-landing .

      - name: Arrancar la landing
        run: |
          docker run -d --name landing -p 8081:80 \
            -e PRESA_APP_URL=https://app.example.test \
            -e PRESA_CONTACT_EMAIL=contacto@example.test \
            presa-landing
          for i in $(seq 1 20); do curl -fs http://localhost:8081/nginx-health && break; sleep 1; done

      - name: Comprobar la landing
        run: sh check.sh http://localhost:8081 https://app.example.test contacto@example.test

      - name: Registro del contenedor
        if: failure()
        run: docker logs landing
